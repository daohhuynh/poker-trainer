<svg xmlns="http://www.w3.org/2000/svg" width="540" height="800" viewBox="0 0 540 800">
  <!-- Poker Trainer monogram: a capital P whose bowl carries the dealer-button chip,
       two verticals joined by a base rule, and a lowercase t in the counter beneath.
       Canvas aspect is 540/800 = 0.675 and MUST stay in step with
       kLogoAspect in src/animations/button_morph.cpp -- draw_image_slot stretches to
       fill its rect, so any disagreement distorts the chip into an ellipse. -->
  <g transform="translate(-707.815 30.654) scale(1.523077)">
  
  <g transform="translate(506 0)">
    <!-- struck relief: bronze copy under the brass, lit from the upper left -->
    <g fill="none" stroke="#A87B4A" stroke-width="40" stroke-linejoin="miter"
       stroke-miterlimit="8" opacity="0.7" transform="translate(4 5)">
      <path d="M 0 448 L 0 32 L 208 32 L 268 92 L 268 212 L 208 272 L 0 272" stroke-linecap="butt"/>
      <path d="M 0 448 L 182 448 L 182 272" stroke-linecap="square"/>
      <path d="M 82.6 272 L 82.6 448" stroke-linecap="butt"/>
      <path d="M 43.4 330.08 L 138.6 330.08" stroke-linecap="butt"/>
    </g>

    <!-- dealer button seated in the bowl of the P -->
    <g transform="translate(134 152) scale(0.37097) translate(-256 -256)">
    <circle cx="256" cy="256" r="248" fill="#487EA6"/>
    <circle cx="256" cy="256" r="226" fill="#2E6E9E"/>
    <circle cx="256" cy="256" r="246" fill="none" stroke="#6994B1" stroke-width="4" stroke-opacity="0.55"/>
    <g transform="rotate(0 256 256)"><rect x="222" y="19" width="68" height="62" rx="11" fill="#F4EFE4" stroke="#244C6A" stroke-width="3" stroke-opacity="0.45"/><circle cx="256" cy="50" r="7.5" fill="#224560"/></g>
    <g transform="rotate(60 256 256)"><rect x="222" y="19" width="68" height="62" rx="11" fill="#F4EFE4" stroke="#244C6A" stroke-width="3" stroke-opacity="0.45"/><circle cx="238" cy="34" r="7.5" fill="#224560"/><circle cx="274" cy="34" r="7.5" fill="#224560"/><circle cx="238" cy="66" r="7.5" fill="#224560"/><circle cx="274" cy="66" r="7.5" fill="#224560"/></g>
    <g transform="rotate(120 256 256)"><rect x="222" y="19" width="68" height="62" rx="11" fill="#F4EFE4" stroke="#244C6A" stroke-width="3" stroke-opacity="0.45"/><circle cx="238" cy="34" r="7.5" fill="#224560"/><circle cx="274" cy="66" r="7.5" fill="#224560"/></g>
    <g transform="rotate(180 256 256)"><rect x="222" y="19" width="68" height="62" rx="11" fill="#F4EFE4" stroke="#244C6A" stroke-width="3" stroke-opacity="0.45"/><circle cx="238" cy="34" r="7.5" fill="#224560"/><circle cx="274" cy="34" r="7.5" fill="#224560"/><circle cx="238" cy="50" r="7.5" fill="#224560"/><circle cx="274" cy="50" r="7.5" fill="#224560"/><circle cx="238" cy="66" r="7.5" fill="#224560"/><circle cx="274" cy="66" r="7.5" fill="#224560"/></g>
    <g transform="rotate(240 256 256)"><rect x="222" y="19" width="68" height="62" rx="11" fill="#F4EFE4" stroke="#244C6A" stroke-width="3" stroke-opacity="0.45"/><circle cx="238" cy="34" r="7.5" fill="#224560"/><circle cx="256" cy="50" r="7.5" fill="#224560"/><circle cx="274" cy="66" r="7.5" fill="#224560"/></g>
    <g transform="rotate(300 256 256)"><rect x="222" y="19" width="68" height="62" rx="11" fill="#F4EFE4" stroke="#244C6A" stroke-width="3" stroke-opacity="0.45"/><circle cx="238" cy="34" r="7.5" fill="#224560"/><circle cx="274" cy="34" r="7.5" fill="#224560"/><circle cx="256" cy="50" r="7.5" fill="#224560"/><circle cx="238" cy="66" r="7.5" fill="#224560"/><circle cx="274" cy="66" r="7.5" fill="#224560"/></g>
    <circle cx="256" cy="256" r="168" fill="none" stroke="#EDE3D3" stroke-opacity="0.78" stroke-width="10" stroke-linecap="butt" stroke-dasharray="24.19 19.79"/>
    <path d="M 180 335 L 180 177 L 256 282 L 332 177 L 332 335" fill="none" stroke="#7A9A65" stroke-width="40" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="6"/>
    <path d="M 30.69 164.97 A 243 243 0 0 1 481.31 164.97" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="9" stroke-linecap="round"/>
    <path d="M 481.31 347.03 A 243 243 0 0 1 30.69 347.03" fill="none" stroke="#120C0A" stroke-opacity="0.18" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- P: stem plus angular bowl, right descender and base closing the frame, lowercase t in the counter -->
    <g fill="none" stroke="#EFB42E" stroke-width="40" stroke-linejoin="miter"
       stroke-miterlimit="8">
      <path d="M 0 448 L 0 32 L 208 32 L 268 92 L 268 212 L 208 272 L 0 272" stroke-linecap="butt"/>
      <path d="M 0 448 L 182 448 L 182 272" stroke-linecap="square"/>
      <path d="M 82.6 272 L 82.6 448" stroke-linecap="butt"/>
      <path d="M 43.4 330.08 L 138.6 330.08" stroke-linecap="butt"/>
    </g>
  </g>
</g>
</svg>

  <!-- ================= HEAD =================
       Outline landmarks, front edge from the top down:
         forehead recedes -> BROW RIDGE steps out (y272) -> nasion dips back in
         (y294) -> NOSE runs out to a tip at x508 -> steps back to the nose base
         -> lip ripple -> CHIN steps out (y448) -> under-chin cuts back ->
         JAWLINE runs to the gonion (x748) -> up the ramus behind the ear.
       Not one of these is drawn on the face; they are outline only. -->
  <g id="head_p">
    <path d="M686 154 C748 154 798 184 814 226 C828 260 830 300 826 342 C822 386 810 424 790 448 C774 468 752 478 724 478 C700 478 668 480 640 484 C614 488 588 482 570 470 C558 462 552 456 554 448 C556 440 564 434 570 429 C578 424 562 419 558 412 C554 406 562 402 566 398 C570 394 560 390 556 386 C551 381 556 375 562 372 C550 366 520 354 508 348 C502 345 508 338 516 332 C528 322 536 316 542 308 C550 300 558 298 564 294 C558 286 534 282 538 272 C541 256 545 246 550 234 C566 194 620 154 686 154 Z" fill="#C8996C"/>
    <g clip-path="url(#head_clip_p)">
      <!-- back of the skull turns away from the light -->
      <path d="M738 120 C778 218 788 366 758 512 L880 512 L880 120 Z" fill="#8A5F38" opacity="0.19"/>
      <!-- light plane down the face front; its boundary sits on the cheek, far
           from the nose, so it can never read as a drawn feature -->

      <ellipse cx="636" cy="330" rx="58" ry="80" fill="#DDB68D" opacity="0.10"/>
      <ellipse cx="612" cy="414" rx="44" ry="30" fill="#DDB68D" opacity="0.09"/>
      <ellipse cx="604" cy="252" rx="50" ry="32" fill="#A87B4A" opacity="0.07"/>
      <!-- cheekbone into jaw plane -->
      <path d="M580 344 C612 358 656 358 688 344 C682 392 636 414 592 402 C580 388 578 364 580 344 Z" fill="#A87B4A" opacity="0.09"/>
      <!-- under-jaw core shadow: what separates the head from the neck -->
      <ellipse cx="662" cy="492" rx="132" ry="40" fill="#8A5F38" opacity="0.28"/>
      <path d="M566 466 C614 492 700 494 764 470 L772 524 L540 524 Z" fill="#7A5330" opacity="0.16"/>
    </g>
  </g>


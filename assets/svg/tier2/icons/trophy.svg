    <path d="M 180 56 C 228 56 232 132 180 132"/>
    <!-- cup -->
    <path d="M 76 44 L 180 44 L 180 92 C 180 130 156 152 128 152 C 100 152 76 130 76 92 Z"/>
    <!-- stem and foot -->
    <path d="M 128 152 L 128 202"/>
    <path d="M 84 212 L 172 212"/>
  </g>
</svg>
